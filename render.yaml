# Demonstração pública do mec-qrsafe no Render (plano gratuito). Passo a passo em docs/DEMO.md.
# Sem banco e sem segredos: o app não guarda nada (gera, valida e exporta).
services:
  - type: web
    name: mec-qrsafe
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: master
    autoDeploy: true # o master só recebe código com a CI verde
    healthCheckPath: /api/v1/health
    envVars:
      # O Render encaminha o tráfego para a porta desta variável; a aplicação escuta na 8080.
      - key: PORT
        value: "8080"
      # O plano gratuito tem 512 MB de RAM: heap limitado e GC serial (menos memória e threads).
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError
      # O IP do visitante vem no X-Forwarded-For do proxy do Render (limite por IP).
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      # Limite por IP: o editor faz uma requisição a cada pausa de digitação, então o teto geral é
      # folgado; o export (que desenha PNGs de até 4096 px) tem um teto bem menor.
      - key: MECQRSAFE_RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"
      - key: MECQRSAFE_RATE_LIMIT_EXPORTS_PER_MINUTE
        value: "10"
      # O Render fica atrás da Cloudflare: o IP real do visitante vem neste cabeçalho, que a
      # Cloudflare sobrescreve (o do X-Forwarded-For, sozinho, é o do servidor da borda).
      - key: MECQRSAFE_RATE_LIMIT_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: LOGGING_LEVEL_COM_MECQRSAFE
        value: INFO
      # O editor estático (abaixo) chama a API de outra origem. A própria origem da API continua na
      # lista porque a imagem ainda serve o editor em mec-qrsafe.onrender.com.
      - key: MECQRSAFE_CORS_ALLOWED_ORIGINS
        value: https://mec-qrsafe-editor.onrender.com,https://mec-qrsafe.onrender.com

  # Editor como site estático: no plano gratuito, site estático não dorme nem gasta as 750 horas
  # do workspace. Abre na hora e mostra "acordando o servidor" enquanto a API acima sobe.
  - type: web
    name: mec-qrsafe-editor
    runtime: static
    branch: master
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION # o README pede Node 22.12+
        value: "22.12.0"
      - key: VITE_API_ORIGIN
        value: https://mec-qrsafe.onrender.com
